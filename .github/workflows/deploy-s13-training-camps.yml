name: Deploy S13 Training Camps

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

concurrency:
  group: s13-training-camps
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy S13
    runs-on: [self-hosted, linux, ubuntu, docker, shell, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Set image tag from commit
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          image_tag="${commit_sha: -4}"
          printf 'IMAGE_TAG=%s\n' "$image_tag" >> "$GITHUB_ENV"
          echo "Building the S13 image with tag: $image_tag"

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          docker compose config --quiet

      - name: Build fresh images
        run: |
          set -euo pipefail
          docker compose build --pull

      - name: Take down current application
        run: |
          set -euo pipefail
          docker compose down --remove-orphans

      - name: Start application with new images
        run: |
          set -euo pipefail
          docker compose up --build --force-recreate --remove-orphans -d

      - name: Verify deployment health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:8080/health" >/dev/null && \
               curl --fail --silent --show-error "http://127.0.0.1:8080/api/courses" >/dev/null; then
              docker compose ps
              echo "The S13 Training Camps container is healthy with image tag ${IMAGE_TAG}."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
