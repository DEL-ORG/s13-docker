name: Build Docker image on push

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build S13 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag "s13-training-camps:${GITHUB_SHA}" .

      - name: Show built image
        run: docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' "s13-training-camps:${GITHUB_SHA}"
